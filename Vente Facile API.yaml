      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchCreate'
          description: ''
  /api/v1/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: |-
        ViewSet pour la gestion des branches/succursales.

        Endpoints:
        - GET /branches/ : Liste des branches
        - POST /branches/ : Créer une branche
        - GET /branches/{id}/ : Détail d'une branche
        - PUT/PATCH /branches/{id}/ : Modifier une branche
        - DELETE /branches/{id}/ : Supprimer une branche
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetail'
          description: ''
    put:
      operationId: branches_update
      description: |-
        ViewSet pour la gestion des branches/succursales.

        Endpoints:
        - GET /branches/ : Liste des branches
        - POST /branches/ : Créer une branche
        - GET /branches/{id}/ : Détail d'une branche
        - PUT/PATCH /branches/{id}/ : Modifier une branche
        - DELETE /branches/{id}/ : Supprimer une branche
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
