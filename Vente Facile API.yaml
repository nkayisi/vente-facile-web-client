  /api/v1/sync/:
    get:
      operationId: sync_retrieve
      description: "\n        Pull changes from the server since the last sync.\n
        \       \n        For initial sync, omit last_pulled_at or set it to 0.\n
        \       The response follows WatermelonDB sync protocol format.\n        "
      summary: Pull sync changes
      parameters:
      - in: query
        name: last_pulled_at
        schema:
          type: integer
          format: int64
        description: Unix timestamp in milliseconds of last pull. 0 or omit for initial
          sync.
      - in: query
        name: tables
        schema:
          type: string
        description: Comma-separated list of tables to sync. Omit for all tables.
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InitialSyncResponse:
                  value:
                    changes:
                      products:
                        created:
                        - id: '...'
                          name: Product 1
                        updated: []
                        deleted: []
                      customers:
                        created:
                        - id: '...'
                          name: Customer 1
                        updated: []
                        deleted: []
                    timestamp: 1705315800000
                    schema_version: 1
                  summary: Initial sync response
          description: ''
    post:
      operationId: sync_create
      description: "\n        Push local changes to the server and optionally pull
        updates.\n        \n        The request body should contain:\n        - changes:
        Object with table names as keys, each containing created/updated/deleted arrays\n
        \       - last_pulled_at: Timestamp of last pull (for conflict detection)\n
        \       \n        The response includes push stats and optionally pull changes.\n
        \       "
      summary: Push sync changes
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              PushRequest:
                value:
                  changes:
                    sales:
                      created:
                      - id: uuid-here
                        reference: VT-20240115-0001
                        customer_id: customer-uuid
                        total: '15000.00'
                        status: completed
                      updated: []
                      deleted: []
                  last_pulled_at: 1705315800000
                summary: Push request
              PushResponse:
                value:
                  push:
                    success: true
                    stats:
                      created: 1
                      updated: 0
                      deleted: 0
                      conflicts: 0
                      errors: 0
                    errors: []
                    timestamp: 1705315900000
                  pull:
                    changes: {}
                    timestamp: 1705315900000
                    schema_version: 1
                summary: Push response
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                PushRequest:
                  value:
                    changes:
                      sales:
                        created:
                        - id: uuid-here
                          reference: VT-20240115-0001
                          customer_id: customer-uuid
                          total: '15000.00'
                          status: completed
                        updated: []
                        deleted: []
                    last_pulled_at: 1705315800000
                  summary: Push request
                PushResponse:
                  value:
                    push:
                      success: true
                      stats:
                        created: 1
                        updated: 0
                        deleted: 0
                        conflicts: 0
                        errors: 0
                      errors: []
                      timestamp: 1705315900000
                    pull:
                      changes: {}
                      timestamp: 1705315900000
                      schema_version: 1
                  summary: Push response
          description: ''
