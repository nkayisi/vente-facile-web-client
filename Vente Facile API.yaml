  /api/v1/cash-movements/:
    get:
      operationId: cash_movements_list
      description: |-
        ViewSet pour les mouvements de caisse.

        Les mouvements liés aux ventes et dépenses sont créés automatiquement.
        Ce ViewSet permet aussi de créer des mouvements manuels
        (apports de fonds, retraits, ajustements, etc.).

        Filtrage par entrepôt : un mouvement est visible si
        - le membre est ``owner``, OU
        - la vente liée appartient au périmètre du membre, OU
        - la dépense liée appartient au périmètre du membre.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
        description: |-
          * `in` - Entrée
          * `out` - Sortie
      - in: query
        name: is_cancelled
        schema:
          type: boolean
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - adjustment
          - change
          - debt_collection
          - expense
          - fund_in
          - fund_out
          - other_in
          - other_out
          - purchase
          - sale
          - sale_return
          - supplier_refund
        description: |-
          * `sale` - Vente
          * `sale_return` - Remboursement client
          * `expense` - Dépense
          * `purchase` - Achat fournisseur
          * `supplier_refund` - Remboursement fournisseur
          * `debt_collection` - Recouvrement dette
          * `fund_in` - Apport de fonds
          * `fund_out` - Retrait de fonds
          * `adjustment` - Ajustement de caisse
          * `change` - Monnaie rendue
          * `other_in` - Autre entrée
          * `other_out` - Autre sortie
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - cash-movements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashMovementListList'
          description: ''
    post:
      operationId: cash_movements_create
      description: |-
        ViewSet pour les mouvements de caisse.

        Les mouvements liés aux ventes et dépenses sont créés automatiquement.
        Ce ViewSet permet aussi de créer des mouvements manuels
        (apports de fonds, retraits, ajustements, etc.).

        Filtrage par entrepôt : un mouvement est visible si
        - le membre est ``owner``, OU
        - la vente liée appartient au périmètre du membre, OU
        - la dépense liée appartient au périmètre du membre.
      tags:
      - cash-movements
      requestBody:
