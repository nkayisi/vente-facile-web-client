      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
        required: true
      security:
