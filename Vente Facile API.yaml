        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchCreate'
          description: ''
    delete:
      operationId: branches_destroy
      description: |-
        ViewSet pour la gestion des branches/succursales.

        Endpoints:
